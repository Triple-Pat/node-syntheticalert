name: Release
run-name: 'Release ${{ github.ref_name }}'
on:
  push:
    tags:
      - 'v*'
permissions: {}
jobs:
  # A tag on a commit that fails lint or tests never reaches npm. CI also
  # packs and checks the tarball this workflow publishes.
  ci:
    name: Lint and Test
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    # npm trusts this workflow file in this environment and no other.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@triplepat/syntheticalert
    permissions:
      id-token: write # trusted publishing, and npm's provenance attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: pkg/
      - name: Check the tag names the package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Pre-releases would need their own npm dist-tag, or they would
          # land on latest; refuse them until one is wanted.
          case "${TAG}" in
            *-*)
              echo "::error::pre-release tag ${TAG}: publishing one needs an npm dist-tag first"
              exit 1
              ;;
          esac
          tarball="pkg/triplepat-syntheticalert-${TAG#v}.tgz"
          if [ ! -f "${tarball}" ]; then
            echo "::error::tag ${TAG} does not match the packed package: $(ls pkg)"
            exit 1
          fi
      # Trusted publishing needs npm 11.5.1 or later; Node 24 LTS ships it.
      # No cache, and no checkout: nothing here installs or runs a package.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Publish to npm
        run: npm publish --access public pkg/*.tgz

  # Its own job, after publish, so a failure here re-runs alone instead of
  # repeating a publish npm would refuse. Draft, so the release notes get a
  # review before anyone sees them.
  draft-release:
    name: Draft the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: pkg/
      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft --verify-tag --title "${TAG}" --notes "" pkg/*.tgz
