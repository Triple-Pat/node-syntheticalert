name: Lint and Test
run-name: 'Lint and Test: ${{ github.event.head_commit.message || github.event.pull_request.title }}'
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    name: Lint and Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the engines floor (22.18+ runs .ts tests directly and can
        # require() an ES module; setup-node resolves "22" to the latest 22.x).
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci

      # --- Linting ---
      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint
      - name: Prettier
        run: npx prettier --check .
      - name: ESLint
        run: npx eslint .
      - name: Type check
        run: npx tsc --noEmit

      # --- Tests ---
      - name: Tests
        run: npm run test:run
      # Feeds the README's Coveralls badge with measured coverage, so it
      # runs before the coverage gate: the badge shows the real number even
      # when the gate fails. Main only: the badge tracks main, and pull
      # requests are held to the gate below rather than reported to
      # Coveralls. One matrix leg only (the first, so the condition survives
      # matrix edits), so Coveralls sees one report per commit. A Coveralls
      # outage must not redden a run whose lint and tests passed, hence
      # fail-on-error: false.
      - name: Coveralls
        if: github.ref == 'refs/heads/main' && strategy.job-index == 0
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
          fail-on-error: false
      - name: Coverage gate
        run: npm run coverage:check
      - name: Build
        run: npm run build
      # Proves the README's claim rather than asserting it.
      - name: CommonJS consumers can require() the package
        run: node -e "const { syntheticAlert } = require('./dist/index.js'); console.log('value', syntheticAlert()())"
